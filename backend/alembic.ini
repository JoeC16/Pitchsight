# Alembic CLI config. The app runs migrations itself on startup (app/migrate.py); use this for
# authoring:  alembic revision --autogenerate -m "add x"   and   alembic upgrade head
# The database URL comes from PITCHSIGHT_DB_URL / PITCHSIGHT_DATA_DIR (see app/config.py).
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
