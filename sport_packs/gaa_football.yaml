# Sport pack: GAA football.
# This file is the single source of truth for what can be tagged. The API validates
# events against it and the UI builds its filters from it. To add a classification,
# add a value or attribute here -- no code changes needed.
#
# Event.team semantics (per event type) are documented in `team_means`.

sport: gaa_football
name: GAA Football
periods: 2
period_minutes: 35

scoring:
  event: shot
  attribute: outcome
  values: { goal: 3, point: 1, two_pointer: 2 }   # two_pointer = score from outside the arc (competition rule dependent)
  display: gaa                                     # renders as goals-points (total), e.g. 1-08 (11)

event_types:
  - id: shot
    label: Shot
    color: "#f5a524"
    team_means: Team taking the shot
    attributes:
      - { id: outcome,  label: Outcome,  values: [goal, point, two_pointer, wide, short, saved, blocked, post] }
      - { id: source,   label: Source,   values: [from_play, free, forty_five, penalty, sideline_cut] }
      - { id: method,   label: Method,   values: [hand, left_foot, right_foot] }
      - { id: pressure, label: Pressure, values: [none, low, high] }
      - { id: side,     label: Side,     values: [left, centre, right] }
      - { id: zone,     label: Zone,     values: [own_third, middle_third, attacking_third, inside_45] }
      - { id: origin,   label: Origin,   values: [turnover, kickout, restart, sustained_possession] }

  - id: turnover
    label: Turnover
    color: "#ef5b5b"
    team_means: Team that WON possession
    attributes:
      - { id: kind, label: Kind, values: [tackle, interception, forced_error, unforced_error, foul_won] }
      - { id: zone, label: Zone, values: [own_third, middle_third, attacking_third, inside_45] }

  - id: kickout
    label: Kickout
    color: "#4aa3ff"
    team_means: Team taking the kickout
    attributes:
      - { id: outcome, label: Outcome, values: [retained_clean, retained_break, lost_clean, lost_break] }
      - { id: length,  label: Length,  values: [short, medium, long] }
      - { id: target,  label: Target,  values: [left, centre, right] }

  - id: free
    label: Free conceded
    color: "#b07cff"
    team_means: Team that CONCEDED the free
    attributes:
      - { id: reason, label: Reason, values: [tackle, over_carry, handpass_throw, other] }
      - { id: zone,   label: Zone,   values: [own_third, middle_third, attacking_third, inside_45] }

# Pitch geometry (metres), used for calibration (pixel -> pitch) and to derive zone/side.
# x runs along the pitch from the LEFT end line (as the camera sees it) to the right end line;
# y runs across it from the NEAR (camera-side) sideline to the far one.
pitch:
  length: { default: 140, min: 130, max: 145 }
  width:  { default: 85, min: 80, max: 90 }
  lines_from_each_end: [13, 20, 45]          # full-width lines, metres from each end line
  boxes:                                      # centred on each goal: depth from end line x width
    - { name: small rectangle, depth: 4.5, width: 14 }
    - { name: large rectangle, depth: 13, width: 19 }
  goal_width: 6.5
  # Rules for the `zone` attribute, from the point of view of the team in possession.
  # First rule that matches AND whose value the event type allows wins.
  #   from_goal: [a, b]  distance in metres from the end line being attacked
  #   third:     [a, b]  fraction of the length toward the attacked end (0 = own end line)
  #   box:       name    inside that box at the attacked end
  zones:
    - { value: inside_45, from_goal: [0, 45] }
    - { value: attacking_third, third: [0.6667, 1.0] }
    - { value: middle_third, third: [0.3333, 0.6667] }
    - { value: own_third, third: [0, 0.3333] }
  # `side` attribute: the pitch width split into equal lanes, left to right as the attacking team sees it.
  sides: [left, centre, right]
