name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.db }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pitchsight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PITCHSIGHT_TEST_DB_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://postgres:postgres@localhost:5432/pitchsight_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest
        working-directory: backend

  e2e:
    name: browser tests
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements-dev.txt
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Test videos
        run: |
          mkdir -p /tmp/media
          ffmpeg -y -loglevel error -f lavfi -i "testsrc2=duration=180:size=1280x720:rate=25" -f lavfi -i "sine=duration=180" \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -shortest /tmp/media/match.mp4
          ffmpeg -y -loglevel error -f lavfi -i "testsrc2=duration=180:size=1280x720:rate=25" -f lavfi -i "sine=duration=180" \
            -c:v mpeg4 -q:v 5 -c:a libopus -shortest /tmp/media/match.mkv
          python e2e/make_pitch_video.py /tmp/pitch
      - name: Start server
        working-directory: backend
        run: |
          PITCHSIGHT_DATA_DIR=/tmp/data nohup uvicorn app.main:app --port 8000 > /tmp/server.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8000/api/health && exit 0; sleep 1; done; cat /tmp/server.log; exit 1
      - run: node e2e/ui_smoke.js /tmp/media/match.mp4 http://localhost:8000 /tmp/shots /tmp/media/match.mkv
      - run: node e2e/pitch_smoke.js /tmp/pitch http://localhost:8000 /tmp/shots
      - if: failure()
        run: cat /tmp/server.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/shots

  docker:
    name: docker compose
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: App healthy on Postgres
        run: |
          for i in $(seq 60); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf localhost:8000/api/health
          curl -sf -X POST localhost:8000/api/auth/register -H 'content-type: application/json' \
            -d '{"club_name":"CI","email":"ci@example.com","password":"ci-password"}'
          docker compose exec -T app ffmpeg -version | head -1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
