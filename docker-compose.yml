# Local development stack:  docker compose up --build   ->  http://localhost:8000
# Data lives in named volumes; `docker compose down -v` wipes it.
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: pitchsight
      POSTGRES_PASSWORD: pitchsight
      POSTGRES_DB: pitchsight
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchsight"]
      interval: 3s
      retries: 20

  # S3 emulator (moto) standing in for AWS S3 / Cloudflare R2. In memory: restarting it loses the
  # files, so use a real bucket for anything you want to keep.
  s3:
    image: pitchsight-dev:local      # built once here, reused by s3-bucket
    build:
      context: .
      target: dev
      args: { PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12-slim}" }
    command: ["moto_server", "-H", "0.0.0.0", "-p", "9000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/moto-api/')"]
      interval: 3s
      retries: 20

  s3-bucket:
    image: pitchsight-dev:local
    pull_policy: never
    environment:
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev
      AWS_DEFAULT_REGION: us-east-1
    command: ["python", "-c", "import boto3; boto3.client('s3', endpoint_url='http://s3:9000').create_bucket(Bucket='pitchsight'); print('bucket ready')"]
    healthcheck: { disable: true }
    depends_on:
      s3: { condition: service_healthy }

  app:
    image: pitchsight:local          # built once here, reused by worker
    build:
      context: .
      target: app
      args: { PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12-slim}" }
    environment: &env
      PITCHSIGHT_DB_URL: postgresql+psycopg://pitchsight:pitchsight@db:5432/pitchsight
      PITCHSIGHT_DETECTOR: ${PITCHSIGHT_DETECTOR:-stub}
      PITCHSIGHT_JOBS: queue
      PITCHSIGHT_STORAGE: s3
      PITCHSIGHT_S3_BUCKET: pitchsight
      PITCHSIGHT_S3_ENDPOINT: http://s3:9000
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev
      AWS_DEFAULT_REGION: us-east-1
    volumes: [appdata:/data]
    ports: ["8000:8000"]
    depends_on: &deps
      db: { condition: service_healthy }
      s3-bucket: { condition: service_completed_successfully }

  # Runs processing, proxy and reel jobs. Its own disk on purpose: like a separate machine, it
  # gets videos from the bucket. Scale with `docker compose up --scale worker=3`.
  worker:
    image: pitchsight:local
    pull_policy: never
    environment: *env
    command: ["python", "-m", "app.worker"]
    healthcheck: { disable: true }
    depends_on: *deps

volumes:
  pgdata:
  appdata:
